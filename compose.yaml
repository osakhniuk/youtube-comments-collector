services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - youtube_collector.main
      - --mode
      - incremental
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    init: true
    profiles:
      - collector

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -q
    init: true
    profiles:
      - test
